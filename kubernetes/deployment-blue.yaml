apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
  namespace: vle8-app
  labels:
    app: myapp
    color: blue
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      color: blue
  template:
    metadata:
      labels:
        app: myapp
        color: blue
        version: v1
    spec:
      containers:
        - name: myapp
          image: myapp:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_NAME
              value: "VLE-8 Blue-Green Deployment"
            - name: APP_COLOR
              value: "BLUE"
            - name: APP_VERSION
              value: "v1"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "96Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
